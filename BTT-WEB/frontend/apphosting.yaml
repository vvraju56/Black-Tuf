# Firebase App Hosting configuration for the Next.js frontend.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: NEXT_PUBLIC_API_URL
    value: https://your-api-domain
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://your-site-domain
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-api-key
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: firebase-auth-domain
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: firebase-project-id
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: firebase-storage-bucket
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: firebase-messaging-sender-id
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: firebase-app-id
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    secret: firebase-vapid-key